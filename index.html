<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Dragón de la Escuela Rural</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { 
            background: linear-gradient(135deg, #fff0f5, #e6f2ff); 
            min-height: 100vh;
            padding: 20px;
        }
        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .oculto { display: none !important; }
        h1 { text-align: center; color: #7b4173; margin-bottom: 10px; }
        h2 { text-align: center; color: #5b5b9e; margin-bottom: 25px; }
        .historia {
            background: linear-gradient(135deg, #fef3ff, #f0f7ff);
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid #b388eb;
            font-size: 18px;
            line-height: 1.8;
            color: #444;
            margin: 30px 0;
            text-align: center;
        }
        .pregunta {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            text-align: center;
        }
        .opcion {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin: 10px 0;
            border: 3px solid #ddd;
            border-radius: 12px;
            background: #f9f9f9;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .opcion:hover:not(.desactivada) {
            border-color: #9966cc;
            background: #f3efff;
            transform: scale(1.02);
        }
        .opcion.correcta {
            border-color: #22c55e;
            background: #f0fdf4;
            color: #166534;
            font-weight: bold;
        }
        .opcion.incorrecta {
            border-color: #ef4444;
            background: #fef2f2;
            color: #991b1b;
        }
        .opcion.desactivada {
            pointer-events: none;
            opacity: 0.7;
        }
        .retroalimentacion {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 17px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }
        .retro-correcto {
            background: #f0fdf4;
            border: 2px solid #22c55e;
            color: #166534;
        }
        .retro-incorrecto {
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }
        .boton {
            display: block;
            width: 250px;
            margin: 25px auto;
            padding: 15px;
            background: linear-gradient(90deg, #ff66b2, #9966cc);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .boton:hover { transform: scale(1.05); }
        .fila-eleccion {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        .tarjeta-eleccion {
            text-align: center;
            cursor: pointer;
            padding: 20px;
            border-radius: 15px;
            border: 4px solid transparent;
            transition: all 0.3s;
            background: #fafafa;
        }
        .tarjeta-eleccion:hover {
            border-color: #ff99cc;
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .tarjeta-eleccion img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .etiqueta {
            font-size: 20px;
            font-weight: bold;
            color: #555;
        }
        .progreso {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            color: #888;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .dragon-final {
            text-align: center;
            margin: 30px 0;
        }
        .dragon-final img {
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .entrada-nombre {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            font-size: 20px;
            border: 3px solid #dda0dd;
            border-radius: 12px;
            text-align: center;
            margin: 20px auto;
            display: block;
        }
        .nombre-mascota {
            font-size: 28px;
            font-weight: bold;
            color: #7b4173;
            text-align: center;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<!-- Música de fondo → SIN autoplay para que no bloquee nada -->
<audio id="musicaFondo" loop>
    <source src="kis.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.


<div class="contenedor" id="pantalla-inicio">
    <h1>🐉 El Dragón de la Escuela Rural</h1>
    
    <div class="historia">
        <p>En lo alto de las montañas, donde el aire es fresco y los caminos suben entre verdes praderas, existe una escuela muy especial. 🏔️</p>
        <br>
        <p>Allí, un pequeño dragón mágico espera despertar… pero solo lo hará si tú demuestras que conoces cómo cuidar y guiar la educación del campo. ✨</p>
        <br>
        <p>Con cada respuesta correcta, la magia crece y tú eliges cómo será tu compañero. ¿Estás listo para la aventura? 🗺️</p>
    </div>
    
    <button class="boton" onclick="iniciarJuego()">🚀 Comenzar la aventura</button>
</div>

<div class="contenedor oculto" id="pantalla-pregunta">
    <div class="progreso">
        <span id="texto-progreso"></span>
        <span id="puntos-buenas">✅ Buenas: 0</span>
        <span id="puntos-malas">❌ Malas: 0</span>
    </div>
    <div class="pregunta" id="texto-pregunta"></div>
    <div id="contenedor-opciones"></div>
    <div id="retroalimentacion" class="retroalimentacion oculto"></div>
    <button id="boton-siguiente" class="boton oculto" onclick="siguientePregunta()">Siguiente ➡️</button>
</div>

<div class="contenedor oculto" id="pantalla-elegir-dragon">
    <h2>🔥 ¡La magia despierta!</h2>
    <p style="text-align:center; font-size:18px; color:#555; margin-bottom:30px;">Tu primera luz brilla. ¿Qué tipo de dragón será tu compañero? 🐉</p>
    <div class="fila-eleccion">
        <div class="tarjeta-eleccion" onclick="elegirDragon('fuego')">
            <img src="dragon de fuego oriquinal.png" alt="Dragón de Fuego" onerror="this.src='https://via.placeholder.com/200?text=Dragón+de+Fuego'">
            <div class="etiqueta">🔥 Dragón de Fuego</div>
        </div>
        <div class="tarjeta-eleccion" onclick="elegirDragon('hielo')">
            <img src="Dragon solo.png" alt="Dragón de Hielo" onerror="this.src='https://via.placeholder.com/200?text=Dragón+de+Hielo'">
            <div class="etiqueta">❄️ Dragón de Hielo</div>
        </div>
    </div>
</div>

<div class="contenedor oculto" id="pantalla-elegir-color">
    <h2>🎨 ¡Cada vez más cerca!</h2>
    <p style="text-align:center; font-size:18px; color:#555; margin-bottom:30px;">La magia toma color. ¿Cuál será su tono favorito? ✨</p>
    <div class="fila-eleccion">
        <div class="tarjeta-eleccion" onclick="elegirColor('rosa')">
            <img id="img-rosa" src="" alt="Dragón Rosa" onerror="this.src='https://via.placeholder.com/200?text=Rosa'">
            <div class="etiqueta">🩷 Rosa</div>
        </div>
        <div class="tarjeta-eleccion" onclick="elegirColor('azul')">
            <img id="img-azul" src="" alt="Dragón Azul" onerror="this.src='https://via.placeholder.com/200?text=Azul'">
            <div class="etiqueta">🔵 Azul</div>
        </div>
    </div>
</div>

<div class="contenedor oculto" id="pantalla-elegir-accesorio">
    <h2>👑 ¡El toque final!</h2>
    <p style="text-align:center; font-size:18px; color:#555; margin-bottom:30px;">Tu dragón casi está completo. ¿Qué lo hará único? 🌟</p>
    <div class="fila-eleccion">
        <div class="tarjeta-eleccion" onclick="elegirAccesorio('corona')">
            <img id="img-corona" src="" alt="Corona" onerror="this.src='https://via.placeholder.com/200?text=👑+Corona'">
            <div class="etiqueta">👑 Corona</div>
        </div>
        <div class="tarjeta-eleccion" onclick="elegirAccesorio('capa')">
            <img id="img-capa" src="" alt="Capa" onerror="this.src='https://via.placeholder.com/200?text=🦸+Capa'">
            <div class="etiqueta">🦸 Capa</div>
        </div>
        <div class="tarjeta-eleccion" onclick="elegirAccesorio('brillo')">
            <img id="img-brillo" src="" alt="Brillo" onerror="this.src='https://via.placeholder.com/200?text=🌟+Brillo'">
            <div class="etiqueta">🌟 Brillo mágico</div>
        </div>
    </div>
</div>

<div class="contenedor oculto" id="pantalla-poner-nombre">
    <h2>📝 ¡Un nombre especial!</h2>
    <p style="text-align:center; font-size:18px; color:#555; margin:20px 0;">La magia necesita un nombre para ser completa. ¿Cómo se llamará tu compañero? 💫</p>
    <input type="text" id="nombre-mascota" class="entrada-nombre" placeholder="Escribe el nombre aquí..." maxlength="20">
    <button class="boton" onclick="confirmarNombre()">✅ Darle su nombre</button>
</div>

<div class="contenedor oculto" id="pantalla-final">
    <h1>✨ ¡La magia está completa! ✨</h1>
    <div class="nombre-mascota" id="mostrar-nombre"></div>
    <div class="dragon-final">
        <img id="imagen-final" src="" alt="Tu dragón mágico">
    </div>
    <p style="text-align:center; font-size:20px; color:#555; font-weight:bold; margin:15px 0;" id="mensaje-detalle"></p>
    <p style="text-align:center; font-size:22px; color:#7b4173; font-weight:bold; margin:20px 0; padding:15px; background:#f3efff; border-radius:12px;" id="puntaje-final"></p>
    <button class="boton" onclick="reiniciar()">🔄 Vivir la aventura otra vez</button>
</div>

<script>
const preguntas = [
    { numero: 1, texto: "El director rural es:", opciones: { A: "Solo administrador", B: "Directivo docente que lidera en zona rural", C: "Solo docente" }, correcta: "B", explicacion: "Porque en las escuelas rurales el director no solo firma papeles, sino que también enseña y guía a la comunidad." },
    { numero: 2, texto: "Su función central es:", opciones: { A: "Articular gestión pedagógica, comunitaria y más", B: "Solo firmar papeles", C: "Solo buscar recursos" }, correcta: "A", explicacion: "Porque su trabajo no es solo administrativo: debe cuidar la enseñanza, unir a las familias y gestionar recursos." },
    { numero: 3, texto: "¿Qué caracteriza el contexto rural?", opciones: { A: "Aulas multigrado y dispersión", B: "Todo cerca y conectado igual que la ciudad", C: "No hay diferencias" }, correcta: "A", explicacion: "Porque en el campo hay escuelas pequeñas donde varios grados estudian juntos y las viviendas están lejos unas de otras." },
    { numero: 4, texto: "Como líder pedagógico debe:", opciones: { A: "Solo administrar", B: "Acompañar docentes y relacionar con el territorio", C: "No intervenir en las clases" }, correcta: "B", explicacion: "Porque la educación debe conectar con la vida del campo: la huerta, la familia, las tradiciones del lugar." },
    { numero: 5, texto: "La gestión comunitaria vincula:", opciones: { A: "Solo a los directivos", B: "Solo a los estudiantes", C: "Escuela, familias y territorio" }, correcta: "C", explicacion: "Porque la escuela no está sola: funciona mejor cuando todos participan — padres, vecinos y estudiantes." },
    { numero: 6, texto: "¿Quién participa en la dirección?", opciones: { A: "Toda la comunidad educativa", B: "Nadie", C: "Solo el director" }, correcta: "A", explicacion: "Porque la educación es tarea de todos: el director guía, pero todos aportan ideas y colaboran." },
    { numero: 7, texto: "Un proyecto comunitario puede ser:", opciones: { A: "Ninguno", B: "Huerta escolar", C: "Exclusivamente tareas" }, correcta: "B", explicacion: "Porque la huerta une aprendizaje y vida: se aprende ciencias, matemáticas y se trabaja con la tierra." },
    { numero: 8, texto: "La educación rural debe:", opciones: { A: "Copiar la ciudad", B: "Ignorar el territorio", C: "Adaptarse al contexto" }, correcta: "C", explicacion: "Porque cada zona rural tiene su propia cultura, su paisaje y sus necesidades — la educación debe respetar eso." },
    { numero: 9, texto: "Uno de los 5 desafíos es:", opciones: { A: "No hay desafíos", B: "Solo dinero", C: "Ética y sostenibilidad" }, correcta: "C", explicacion: "Porque educar en el campo requiere valores: cuidar la tierra, ser honestos y pensar en el futuro." },
    { numero: 10, texto: "El director rural lidera:", opciones: { A: "Una escuela inserta en su comunidad", B: "Una institución aislada", C: "Solo un grupo de estudiantes" }, correcta: "A", explicacion: "Porque la escuela del campo es el corazón del pueblo: lo que pasa en ella afecta a todos y viceversa." }
];

const rutasImagenes = {
    fuego: { solo: "dragon de fuego oriquinal.png", rosa: "dragon rosa de fuego.png", rosaCorona: "dragon rosa de fuego con corona.png", rosaCapa: "dragon rosa de fuego con capa.png", rosaBrillo: "dragon rosa de fuego con brillo.png", azul: "dragon de fuego azul.png", azulCorona: "DRAGON azul DE FURGO CON CORONA.png", azulCapa: "dragon azul de fuego con capa.png", azulBrillo: "dragon azul de fuego con brillo.png" },
    hielo: { solo: "Dragon solo.png", rosa: "Dragon rosa.png", rosaCorona: "dragon rosa con corona.png", rosaCapa: "Dragon rosa con capa.png", rosaBrillo: "Dragon rosa con brillo.png", azul: "Dragon azul.png", azulCorona: "Dragon azul con corona.png", azulCapa: "Dragon azul con capa.png", azulBrillo: "Dragon azul con brillo.png" }
};

let preguntaActual = 0;
let aciertos = 0;
let fallos = 0;
let metaAlcanzada = { tipo: false, color: false, accesorio: false };
let respondido = false;
let dragonElegido = null;
let colorElegido = null;
let accesorioElegido = null;
let nombreMascota = "";

function ocultarTodas() { document.querySelectorAll('.contenedor').forEach(c => c.classList.add('oculto')); }
function mostrarPantalla(id) { ocultarTodas(); document.getElementById(id).classList.remove('oculto'); }

function iniciarJuego() {
    // Música al darle a Comenzar (nunca falla)
    const musica = document.getElementById('musicaFondo');
    musica.play().catch(err => console.log("Audio bloqueado por el navegador:", err));
    
    preguntaActual = 0;
    aciertos = 0;
    fallos = 0;
    metaAlcanzada = { tipo: false, color: false, accesorio: false };
    respondido = false;
    dragonElegido = null;
    colorElegido = null;
    accesorioElegido = null;
    nombreMascota = "";
    mostrarPantalla('pantalla-pregunta');
    mostrarPregunta();
}

function mostrarPregunta() {
    respondido = false;
    const p = preguntas[preguntaActual];
    document.getElementById('texto-progreso').textContent = `Pregunta ${p.numero} de ${preguntas.length}`;
    document.getElementById('puntos-buenas').textContent = `✅ Buenas: ${aciertos}`;
    document.getElementById('puntos-malas').textContent = `❌ Malas: ${fallos}`;
    document.getElementById('texto-pregunta').textContent = p.texto;
    const contenedor = document.getElementById('contenedor-opciones');
    contenedor.innerHTML = '';
    for (let letra in p.opciones) {
        const btn = document.createElement('button');
        btn.className = 'opcion';
        btn.innerHTML = `<strong>${letra}.</strong> ${p.opciones[letra]}`;
        btn.onclick = () => responder(letra, p.correcta, p.explicacion, btn);
        contenedor.appendChild(btn);
    }
    document.getElementById('retroalimentacion').classList.add('oculto');
    document.getElementById('boton-siguiente').classList.add('oculto');
}

function responder(letra, correcta, explicacion, boton) {
    if (respondido) return;
    respondido = true;
    const opciones = document.querySelectorAll('.opcion');
    opciones.forEach(op => op.classList.add('desactivada'));
    const retro = document.getElementById('retroalimentacion');
    retro.classList.remove('oculto', 'retro-correcto', 'retro-incorrecto');
    if (letra === correcta) {
        aciertos++;
        boton.classList.add('correcta');
        retro.innerHTML = `✅ ¡Correcto! ${explicacion}`;
        retro.classList.add('retro-correcto');
    } else {
        fallos++;
        boton.classList.add('incorrecta');
        opciones.forEach(op => {
            if (op.innerHTML.startsWith(`<strong>${correcta}.</strong>`)) op.classList.add('correcta');
        });
        retro.innerHTML = `❌ No es esa. La respuesta correcta es la ${correcta}.<br>📌 ${explicacion}`;
        retro.classList.add('retro-incorrecto');
    }
    document.getElementById('puntos-buenas').textContent = `✅ Buenas: ${aciertos}`;
    document.getElementById('puntos-malas').textContent = `❌ Malas: ${fallos}`;
    document.getElementById('boton-siguiente').classList.remove('oculto');
}

function siguientePregunta() {
    if (aciertos >= 3 && !metaAlcanzada.tipo) { metaAlcanzada.tipo = true; mostrarPantalla('pantalla-elegir-dragon'); return; }
    if (aciertos >= 6 && !metaAlcanzada.color) { metaAlcanzada.color = true; document.getElementById('img-rosa').src = rutasImagenes[dragonElegido].rosa; document.getElementById('img-azul').src = rutasImagenes[dragonElegido].azul; mostrarPantalla('pantalla-elegir-color'); return; }
    if (aciertos >= 9 && !metaAlcanzada.accesorio) { metaAlcanzada.accesorio = true; const r = rutasImagenes[dragonElegido]; document.getElementById('img-corona').src = r[colorElegido + 'Corona']; document.getElementById('img-capa').src = r[colorElegido + 'Capa']; document.getElementById('img-brillo').src = r[colorElegido + 'Brillo']; mostrarPantalla('pantalla-elegir-accesorio'); return; }
    preguntaActual++;
    if (preguntaActual < preguntas.length) { mostrarPregunta(); }
    else { mostrarPantalla('pantalla-poner-nombre'); document.getElementById('nombre-mascota').value = ""; }
}

function elegirDragon(tipo) { dragonElegido = tipo; mostrarPantalla('pantalla-pregunta'); if (preguntaActual < preguntas.length) mostrarPregunta(); }
function elegirColor(color) { colorElegido = color; mostrarPantalla('pantalla-pregunta'); if (preguntaActual < preguntas.length) mostrarPregunta(); }
function elegirAccesorio(acc) { accesorioElegido = acc; mostrarPantalla('pantalla-pregunta'); if (preguntaActual < preguntas.length) mostrarPregunta(); }

function confirmarNombre() {
    nombreMascota = document.getElementById('nombre-mascota').value.trim();
    if (!nombreMascota) nombreMascota = "Dragón Mágico";
    if (!dragonElegido) dragonElegido = 'fuego';
    if (!colorElegido) colorElegido = 'rosa';
    if (!accesorioElegido) accesorioElegido = 'brillo';
    const clave = colorElegido + accesorioElegido.charAt(0).toUpperCase() + accesorioElegido.slice(1);
    const rutaImagen = rutasImagenes[dragonElegido][clave];
    const nomDragon = dragonElegido === 'fuego' ? 'Dragón de Fuego 🔥' : 'Dragón de Hielo ❄️';
    const nomColor = colorElegido === 'rosa' ? '🩷 Rosa' : '🔵 Azul';
    const nomAcc = accesorioElegido === 'corona' ? '👑 Corona' : accesorioElegido === 'capa' ? '🦸 Capa' : '🌟 Brillo';
    let mensajeMetas = "";
    if (metaAlcanzada.tipo && metaAlcanzada.color && metaAlcanzada.accesorio) mensajeMetas = "🎉 ¡Completaste todas las etapas! Tu magia brilla con fuerza.";
    else if (metaAlcanzada.tipo && metaAlcanzada.color) mensajeMetas = "✨ Muy bien, te faltó elegir el accesorio. ¡La próxima vez será!";
    else if (metaAlcanzada.tipo) mensajeMetas = "👍 Lograste elegir tu dragón. Sigue aprendiendo para completarlo todo.";
    else mensajeMetas = "💪 Sigue practicando. Tu dragón te espera para la próxima aventura.";
    document.getElementById('mostrar-nombre').textContent = `✨ ${nombreMascota} ✨`;
    document.getElementById('imagen-final').src = rutaImagen;
    document.getElementById('mensaje-detalle').innerHTML = `${nomDragon} · ${nomColor} · ${nomAcc}<br>${mensajeMetas}`;
    document.getElementById('puntaje-final').innerHTML = `🏆 Puntaje Final<br>✅ Respuestas correctas: ${aciertos}<br>❌ Respuestas incorrectas: ${fallos}<br>De ${preguntas.length} preguntas en total`;
    mostrarPantalla('pantalla-final');
}

function reiniciar() { mostrarPantalla('pantalla-inicio'); }
</script>

</body>
</html>
